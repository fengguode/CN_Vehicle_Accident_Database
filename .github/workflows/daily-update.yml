name: Daily accident data update

on:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater repository secret is configured
        env:
          UPDATER_REPO_TOKEN: ${{ secrets.UPDATER_REPO_TOKEN }}
        run: |
          if [ -z "$UPDATER_REPO_TOKEN" ]; then
            echo "Missing required Actions secret: UPDATER_REPO_TOKEN"
            echo "Add a fine-grained token with read-only Contents access to fengguode/CN_Vehicle_Accident_Updater."
            exit 1
          fi
      - name: Check out public database
        uses: actions/checkout@v4
      - name: Check out updater methods
        uses: actions/checkout@v4
        with:
          repository: fengguode/CN_Vehicle_Accident_Updater
          path: updater
          token: ${{ secrets.UPDATER_REPO_TOKEN }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hydrate, collect, and publish
        working-directory: updater
        run: |
          npm run hydrate -- ../data/reports.json
          npm run collect
          npm run publish -- ..
      - name: Commit and push generated publication
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data site
          git diff --cached --quiet || git commit -m "Daily accident data update"
          git push
