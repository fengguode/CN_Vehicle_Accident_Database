name: Daily accident data update

on:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public database
        uses: actions/checkout@v4
      - name: Check out updater methods
        uses: actions/checkout@v4
        with:
          repository: fengguode/CN_Vehicle_Accident_Updater
          path: updater
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hydrate, collect, and publish
        working-directory: updater
        env:
          WEIBO_WEB_COOKIE: ${{ secrets.WEIBO_WEB_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run apply-votes -- ../data/votes.json
          npm run hydrate -- ../data/reports.json
          npm run backfill
          npm run collect
          npm run publish -- ..
      - name: Commit and push generated publication
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data site
          git diff --cached --quiet || git commit -m "Daily accident data update"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
